#:schema node_modules/wrangler/config-schema.json
#
# Cloudflare Workers 配置
# ============================================================================
# 部署方式：**Cloudflare Dashboard 连接 GitHub 仓库，推送即自动发布**。
# 建库、建表、上传全部自动化，不需要本地装 Rust，也不需要去控制台粘 SQL。
#
# 一次性准备（全部在网页完成）：
#   1. 建 Turnstile 站点：Dashboard → Turnstile → Add site
#        拿到 Site Key（公开）与 Secret Key（机密）
#   2. 连接 GitHub：Workers & Pages → Create → Workers → Connect to Git
#        Build command : bun run build
#        Deploy command: bun run deploy      ← 自动建库 + 迁移 + 发布
#        Build variable: BUN_VERSION=1.4.4
#   3. 配运行时 Secret：Settings → Variables and Secrets
#        MASTER_KEY            openssl rand -hex 32
#        TURNSTILE_SECRET_KEY  Turnstile 私钥
#        ADMIN_PASSWORD        首次登录口令（登录后自动转为哈希入库）
#        TURNSTILE_SITE_KEY    也可以只写在本文件 [vars] 里
#
# 之后所有业务配置（阿里云账号、Telegram、Bark、日报、时区）都在
# **网页「设置」里改**，存 D1，即时生效，不需要重新部署。
#
# ⚠️ 构建期变量（BUN_VERSION）与运行时变量是两处配置，别放错：
#      Settings → Build → Build variables   → BUN_VERSION
#      Settings → Variables and Secrets     → MASTER_KEY 等（选 Secret）
# ============================================================================

name = "cdt-monitor-worker"

# 由 [build] 生成，不要手改
main = "build/worker/shim.mjs"

compatibility_date = "2025-09-01"

# 强制全局 fetch 只走公网：本 Worker 要访问阿里云、Telegram、Bark 等
# 第三方服务，走公网才是预期行为，避免误命中同账号内的私有来源。
compatibility_flags = ["global_fetch_strictly_public"]

workers_dev = true

# 关闭 Preview URLs：预览域名会把未发布的版本暴露到公网，
# 而这里存的是阿里云凭据。
preview_urls = false

# 云端构建入口（控制台 Build command 也填 `bun run build`）。
# 脚本负责装 Bun / Rust / worker-build 再构建，详见 scripts/build-ci.sh。
[build]
command = "bash scripts/build-ci.sh"

# ---------------------------------------------------------------------------
# D1：**刻意不写 database_id**
#
# wrangler 会按 database_name 自动发现并绑定数据库；首次部署时
# `scripts/deploy.ts` 会先 `d1 create` 再 `d1 migrations apply`。
# 这样连 Git 仓库后不需要先去控制台建库、复制 id、改配置、再提交。
#
# 只有当你希望绑定到**已存在的其它库**时，才需要显式补上 database_id。
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "cdt-monitor"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# 前端静态资源
#
# 产物在 web/dist（由 scripts/build-ci.sh 构建）。
# `run_worker_first = ["/api/*"]` 只让 API 进 Worker，其余静态资源由边缘
# 直接返回 —— 不消耗 Worker 请求配额，也没有冷启动等待。
# ---------------------------------------------------------------------------
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 每 5 分钟巡检一次：流量采样 → 阈值熔断 → 定时开关机 → 抢占式保活 → 日报
[triggers]
crons = ["*/5 * * * *"]

# ---------------------------------------------------------------------------
# 可观测性：**默认关闭**
#
# Workers Logs 按写入量计费，而本项目每 5 分钟跑一次巡检，
# 长时间开着会持续产生噪音与费用。应用层日志也默认只留 error
# （见 src/logging.rs）。
#
# 排障时临时打开：
#   1. 把下面的 enabled 改成 true 并推送，或
#   2. 只在控制台 Settings → Observability 打开（不用改代码）
# 同时把 LOG_LEVEL 调成 info 才能看到流程日志。
# ---------------------------------------------------------------------------
[observability]
enabled = false

[vars]
# Turnstile 站点公钥（可公开）。私钥请配成 Secret，不要写在这里。
# 留空时前端会提示「服务端未配置 TURNSTILE_SITE_KEY」。
TURNSTILE_SITE_KEY = ""

# 日志级别：error（默认，只输出错误）| warn | info | debug
# 默认安静：正常巡检不产生任何日志；失败才有输出。
LOG_LEVEL = "error"

# 刷新任务的跨实例互斥窗口（毫秒），默认 10 分钟
JOB_LOCK_TTL_MS = "600000"
# 会话有效期（毫秒），默认 7 天
SESSION_TTL_MS = "604800000"

# 可选端点覆盖（私有网关 / 排障用，留空则用官方默认）
# ALIYUN_CDT_ENDPOINT = "https://cdt.aliyuncs.com"
# ALIYUN_ECS_ENDPOINT = "https://ecs.aliyuncs.com"
# ALIYUN_BSS_ENDPOINT = "https://business.aliyuncs.com"
